name: toi-stilling-indekser
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - apps/toi-stilling-indekser/**
      - .github/workflows/deploy-toi-stilling-indekser.yaml
      - .github/workflows/deploy-toi-template.yaml
      - buildSrc/**
      - technical-libs/testrapid/**
  workflow_dispatch:

jobs:
  build-deploy:
    uses: ./.github/workflows/deploy-toi-template.yaml
    with:
      app_name: ${{ github.workflow }}
      baseimage-tagged-ref: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/jre:openjdk-25
      deploy_dev_branch: refs/heads/autobump-docker-baseimage
    permissions:
      contents: read
      id-token: write
      security-events: write
