name: toi-helseapp
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: ${{ github.workflow }}
  BASEIMAGE_TAGGED_REF: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/jre:openjdk-25

on:
  push:
    paths:
      - apps/toi-helseapp/**
      - .github/workflows/deploy-toi-helseapp.yaml
      - buildSrc/**
      - technical-libs/testrapid/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build, test, and publish
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      baseimage-tagged-ref: ${{ steps.baseimage.outputs.baseimage-tagged-ref }}
      baseimage-digest: ${{ steps.baseimage.outputs.baseimage-digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java v25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Gradle test and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :apps:${APP_NAME}:test :apps:${APP_NAME}:build
      - uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: toi
      - name: Finn digest for runtime-baseimage
        id: baseimage
        env:
          DOCKERFILE: apps/${{ env.APP_NAME }}/Dockerfile
        run: |
          set -euo pipefail

          # Unngå at argumentet vi skal sende til Dockerfile blir ignorert, f.eks. fordi Dockerfile hardkoder baseimage,
          # som vil føre til at vi lagrer en annen digest enn den som ble deployet
          runtime_from=$(awk 'toupper($1) == "FROM" { image = $2 ~ /^--platform=/ ? $3 : $2 } END { print image }' "$DOCKERFILE")
          if [[ "$runtime_from" != '$BASE_IMAGE_DIGEST_PINNED_REF' && "$runtime_from" != '${BASE_IMAGE_DIGEST_PINNED_REF}' ]]; then
            echo "::error::Siste FROM i Dockerfile må bruke BASE_IMAGE_DIGEST_PINNED_REF som build-argument"
            exit 1
          fi

          if [[ ! "$BASEIMAGE_TAGGED_REF" =~ ^[^[:space:]@]+:[^[:space:]@]+$ ]]; then
            echo "::error::baseimage-tagged-ref må være en full image-referanse med tag, uten digest"
            exit 1
          fi

          baseimage_digest=$( docker buildx imagetools inspect "$BASEIMAGE_TAGGED_REF" | awk '$1 == "Digest:" && !found { print $2; found = 1 }' )
          if [[ -z "$baseimage_digest" || ! "$baseimage_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Fant ingen gyldig SHA-256-digest for runtime-baseimaget: $BASEIMAGE_TAGGED_REF" >&2
            exit 1
          fi

          echo "baseimage-tagged-ref=$BASEIMAGE_TAGGED_REF" >> "$GITHUB_OUTPUT"
          echo "baseimage-digest=$baseimage_digest" >> "$GITHUB_OUTPUT"
          echo "baseimage-digest-pinned-ref=$BASEIMAGE_TAGGED_REF@$baseimage_digest" >> "$GITHUB_OUTPUT"
      - name: Push docker image to GAR
        uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        id: docker-build-push
        with:
          team: toi
          image_suffix: ${{ env.APP_NAME }}
          dockerfile: apps/${{ env.APP_NAME }}/Dockerfile
          docker_context: apps/${{ env.APP_NAME }}
          tag: ${{ github.ref == 'refs/heads/main' && 'latest' || github.sha }}
          build_args: |
            APP_NAME=${{ env.APP_NAME }}
            BASE_IMAGE_DIGEST_PINNED_REF=${{ steps.baseimage.outputs.baseimage-digest-pinned-ref }}

  deploy-to-prod-gcp:
    name: Deploy to prod-gcp
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/${{ env.APP_NAME }}/nais.yaml,apps/${{ env.APP_NAME }}/alerts.yaml
          VAR: image=${{ needs.build-and-publish.outputs.image }}

  call-lagre-docker-baseimage-digest:
    needs: [ build-and-publish, deploy-to-prod-gcp ]
    uses: navikt/toi-github-actions-workflows/.github/workflows/lagre-docker-baseimage-digest.yaml@v16
    with:
      app-navn: toi-helseapp
      baseimage-tagged-ref: ${{ needs.build-and-publish.outputs.baseimage-tagged-ref }}
      baseimage-digest: ${{ needs.build-and-publish.outputs.baseimage-digest }}
    permissions: { }
