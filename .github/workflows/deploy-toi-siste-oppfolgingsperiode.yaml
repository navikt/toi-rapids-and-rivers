name:  toi-siste-oppfolgingsperiode

on:
  push:
    paths:
    - apps/toi-siste-oppfolgingsperiode/**
    - .github/workflows/deploy-toi-siste-oppfolgingsperiode.yaml
    - .github/workflows/deploy-toi-template.yaml
    - buildSrc/**
    - technical-libs/testrapid/**
    - technical-libs/logging/**
  workflow_dispatch:

jobs:
  build-deploy:
    uses: ./.github/workflows/deploy-toi-template.yaml
    with:
      app_name: ${{ github.workflow }}
      deploy_dev_branch: refs/heads/teamlogs-sync-med-rekrutteringstreff
    permissions:
      contents: read
      id-token: write
      security-events: write
