apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: toi-siste-oppfolgingsperiode-pond
  namespace: toi
  labels:
    team: toi
spec:
  image: {{ image }}
  port: 8080
  liveness:
    path: /isalive
  readiness:
    path: /isready
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 1
    max: {{ max_replicas }}
  resources:
    limits:
      memory: 4096Mi
    requests:
      cpu: 100m
      memory: 2048Mi
  kafka:
    pool: {{ kafka_pool }}
    streams: true
  filesFrom:
    - emptyDir:
        medium: Disk
      mountPath: /var/lib/kafka-streams # Samspiller med filen Application.kt: p[StreamsConfig.STATE_DIR_CONFIG] = "/var/lib/kafka-streams/state"
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  env:
    - name: KAFKA_RAPID_TOPIC
      value: toi.rapid-1
    - name: KAFKA_EXTRA_TOPIC
      value: toi.siste-oppfolgingsperiode-fra-aktorid-v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: {{ kafka_consumer_group_id }}
    - name: KAFKA_RESET_POLICY
      value: "earliest"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
      enabled: true
