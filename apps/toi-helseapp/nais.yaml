apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: toi-helseapp
  namespace: toi
  labels:
    team: toi
spec:
  image: {{ image }}
  port: 8080
  liveness:
    path: /isalive
  readiness:
    path: /isready
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 1280Mi
    requests:
      cpu: 100m
      memory: 1024Mi
  strategy:
    type: Recreate
  kafka:
     pool: nav-prod
  env:
    - name: KAFKA_RAPID_TOPIC
      value: toi.rapid-1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: toi-helseapp-rapidconsumer-1
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
      enabled: true
